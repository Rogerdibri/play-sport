services:
  - type: web
    name: playsport
    runtime: docker
    plan: starter
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    disk:
      name: playsport-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PLAYSPORT_ADMIN_ACCOUNT_ID
        sync: false
      - key: PLAYSPORT_IDENTITY_REVIEWER_ACCOUNT_ID
        sync: false
