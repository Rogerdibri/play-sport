name: Publicar en Fly.io
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: fly-deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Publicar
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then echo "::error::Falta el secreto FLY_API_TOKEN en Settings > Secrets and variables > Actions."; exit 1; fi
          set -o pipefail
          # Surface the failure reason as a public annotation; flyctl never prints the token.
          flyctl deploy --remote-only 2>&1 | tee deploy.log || { echo "::error::$(grep -iE 'error|failed' deploy.log | tail -5 | tr '\n' ' ')"; exit 1; }
